<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anthro</title>

    <style>
      /* Prevent padding and border from causing overflow */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: "Inconsolata", "Monaco", monospace;
        overflow: hidden;
        margin: 0;
        color: #a0a2ae;
      }

      nav {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 2rem;
      }

      nav #bar {
        background: rgb(223, 0, 0);
        height: 6px;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        z-index: -1;
      }

      nav i {
        position: static;
        transform: none;
        padding: 10px;
      }

      nav img {
        width: 210px;
        position: relative;
        top: -3px;
      }

      ::after.main-container {
        background: white;
        position: relative;
        perspective: 1200px;
        perspective-origin: 50% -50%;
      }

      @keyframes main-container {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(100vh);
        }
      }
    </style>
  </head>
  <body>
    <div class="top-container">sdfsdf</div>
    <main class="main-container">
      <div class="nav-container">
      <nav>
        
        <i id="menu">menu</i>
        <img src="logo.svg"></img>
        <i id="info" style="cursor: pointer">info</i>
        <div id="bar"></div>
      </nav>
      </div>
      <script>
        document.getElementById("info").onclick = function () {
          const main = document.querySelector("main");
          main.style.transition = "transform 1s cubic-bezier(0.4, 0.2, 0.2, 1)";
          main.style.transformOrigin = "center";
          main.style.transform =
            "perspective(800px) rotateX(0deg) translate3d(0px, 75vh, -300px)";
        };
      </script>
    </main>
  </body>
</html>
