<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotto Bell Curves with Row Sum Mean</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <style>
      canvas {
        margin-bottom: 40px;
      }
    </style>
  </head>
  <body>
    <h2>Lotto Bell Curves (num1 to bonus + Row Sum with Mean)</h2>
    <input type="file" id="csvFile" accept=".csv" />
    <div id="chartsContainer"></div>

    <script>
      document
        .getElementById("csvFile")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          Papa.parse(file, {
            header: true,
            complete: function (results) {
              const columns = [
                "num1",
                "num2",
                "num3",
                "num4",
                "num5",
                "num6",
                "bonus",
              ];
              const freqMaps = {};
              const rowSums = [];

              columns.forEach((col) => (freqMaps[col] = {}));

              results.data.forEach((row) => {
                let sum = 0;
                columns.forEach((col) => {
                  const val = parseInt(row[col], 10);
                  if (!isNaN(val)) {
                    freqMaps[col][val] = (freqMaps[col][val] || 0) + 1;
                    sum += val;
                  }
                });
                if (!isNaN(sum)) rowSums.push(sum);
              });

              const container = document.getElementById("chartsContainer");
              container.innerHTML = "";

              // Draw individual column charts
              columns.forEach((col) => {
                const map = freqMaps[col];
                const labels = Object.keys(map)
                  .map(Number)
                  .sort((a, b) => a - b);
                const data = labels.map((x) => map[x]);

                const canvas = document.createElement("canvas");
                canvas.width = 900;
                canvas.height = 300;
                container.appendChild(canvas);

                new Chart(canvas.getContext("2d"), {
                  type: "line",
                  data: {
                    labels: labels,
                    datasets: [
                      {
                        label: col,
                        data: data,
                        fill: false,
                        borderColor: "rgba(75,192,192,1)",
                        tension: 0.3,
                      },
                    ],
                  },
                  options: {
                    responsive: true,
                    plugins: {
                      legend: { position: "top" },
                      title: { display: true, text: `Frequency: ${col}` },
                    },
                    scales: {
                      x: { title: { display: true, text: "Number" } },
                      y: {
                        beginAtZero: true,
                        title: { display: true, text: "Frequency" },
                      },
                    },
                  },
                });
              });

              // Row sum frequency map
              const sumFreqMap = {};
              rowSums.forEach((sum) => {
                sumFreqMap[sum] = (sumFreqMap[sum] || 0) + 1;
              });

              const sumLabels = Object.keys(sumFreqMap)
                .map(Number)
                .sort((a, b) => a - b);
              const sumData = sumLabels.map((x) => sumFreqMap[x]);

              // Calculate mean
              const mean =
                rowSums.reduce((acc, val) => acc + val, 0) / rowSums.length;

              const annotations = {
                annotations: {
                  mean: {
                    type: "line",
                    xMin: mean,
                    xMax: mean,
                    borderColor: "red",
                    borderWidth: 2,
                    label: {
                      content: `μ = ${mean.toFixed(1)}`,
                      enabled: true,
                      position: "start",
                    },
                  },
                },
              };

              const sumCanvas = document.createElement("canvas");
              sumCanvas.width = 900;
              sumCanvas.height = 300;
              container.appendChild(sumCanvas);

              new Chart(sumCanvas.getContext("2d"), {
                type: "line",
                data: {
                  labels: sumLabels,
                  datasets: [
                    {
                      label: "Row Sum",
                      data: sumData,
                      fill: false,
                      borderColor: "rgba(255,99,132,1)",
                      tension: 0.3,
                    },
                  ],
                },
                options: {
                  responsive: true,
                  plugins: {
                    legend: { position: "top" },
                    title: {
                      display: true,
                      text: "Row Sum Frequency with Mean",
                    },
                    annotation: annotations,
                  },
                  scales: {
                    x: {
                      title: {
                        display: true,
                        text: "Sum of Row (num1 ~ bonus)",
                      },
                    },
                    y: {
                      beginAtZero: true,
                      title: { display: true, text: "Frequency" },
                    },
                  },
                },
              });
            },
          });
        });
    </script>
  </body>
</html>
