    <h1>반목문</h1>
    <script>
      /*
            for(초기값;조건식;증감연산자) {
                반복문 조건에 해당되는만큼 실행

      for (let i = 1; i <= 10; i++) {

      }
    </script>

    <h2>1. 전위/후위 연산자</h2>
    <script>
      // 전위 연산자(++n, --n) : 계산하고 출력
      // 후위 연산자(n++, n--) : 출력하고 계산
      let num = 1;
      num = num + 1;
      // num = num + 1 : ++num, num++
      // num = num - 1 : --num, num--
      console.log(++num); // 3
      console.log(--num); // 2
      console.log(num++); // 2
      console.log(num); // 3
      console.log(num--); // 3
    </script>

    <h2>2. 복합대입연산자</h2>
    <script>
      num = num + 3;
      console.log(num);
      num += 3;
      console.log(num);
      num -= 2;
      console.log(num); //num = num -2;
    </script>

    <h2>3. 배열과 for문</h2>
    <script>
      const movies = ["야당", "파과", "미션 임파서블", "플립", "릴로 & 스티치"];
      const [f1, f2, f3, f4, f5] = movies;
      console.log(movies[0]);
      console.log(movies[1]);
      console.log(movies[2]); //too much work to repeat. Use for (){}
      // i <=4 는 i <5; i++ 같음
      // i <=4 는 i < movies.length; i++ 같음
      for (let i = 0; i <= 4; i++) {
        console.log(movies[i]);
      }

      // for ... in : 인덱스 기반
      // for(const 인덱스 in 배열) {}
      JSON.stringify(movies);
      for (const index in movies) {
        console.log(index[movies]);
      }

      //for ... of : 값 기반
      //for(const 값 of 배열) {}
      for (const value of movies) {
        console.log(value);
      }
    </script>

    <h2>break / continue</h2>
    <script>
      // 1, 3, 5, 7, 9
      for (let i = 1; i <= 10; i++) {
        // // 조건문 사용! 홀수인 경우만!
        // if (i % 2 == 1)
        // console.log(i);
        if (i % 2 == 0) continue;

        // break - 멈춰! 7일때 반복 종료
        console.log(i);
        if (i === 7) break;
      }
    </script>

    <h2>6. 2차원 배열 + 중첩 for문</h2>
    <script>
      const arr = [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
      ];
      // 1, 2, 3, 4, 5, 6, 7, 8, 9
      console.log(arr); //Entire array
      console.log(arr[0]); // [1, 2, 3];
      console.log(arr[0][0]); // 1
      console.log(arr[0][1]); // 2
      console.log(arr[0][2]); // 3
      console.log(arr[1]); // [4, 5, 6]
      console.log(arr[1][0]); // 4
      console.log(arr[1][1]); // 5
      console.log(arr[1][2]); // 6
      console.log(arr[2]); // [7, 8, 9]
      //반복문으로? 2개가 필요

      //   for (let i = 0; i < 3; i++) {
      //     for (let j = 0; j < 3; j++) {
      //       console.log(arr[i][j]);
      //     }
      //   }

      for (let i = 0; i < arr.length; i++) {
        // console.log("길이 :", arr[i].length);
        for (let j = 0; j < arr[i].length; j++) {
          console.log(arr[i][j]);
        }
      }

      //for .. of
      for (const i of arr) {
        //console.log(i);
        for (const j of i) {
          console.log(j);
        }
      }
    </script>
