<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내장객체</title>
  </head>
  <body>
    <h1>내장 객체</h1>
    <p>자바스크립트에서 제공하는 기본 내장 객체들</p>
    <h2>Math 객체</h2>
    <script>
      const num = [5, 7, -1, -8];
      console.log("최소값 : ", Math.min(5, 7, -1, -8)); // -8
      console.log("최대값 : ", Math.max(5, 7, -1, -8)); // 7
      console.log("절대값 : ", Math.abs(-7.5736374737)); // -7.57..
      console.log("반올림 : ", Math.round(2.897)); // 3
      console.log("버 림  : ", Math.floor(2.897)); // 2
      console.log("올 림  : ", Math.ceil(2.987)); // 3
      console.log("랜 덤  :", Math.random()); // 0 과 1 사이]
      // 0 <= Math.random() < 1
      // 0 * 10 <= <Math.random() * 10 < 1 * 10
      // 0 <= Math.random() * 10 < 10
      // 1 <= Math.random() * 10 + 1 < 11
      console.log(Math.floor(Math.random() * 10 + 1));
      //어디까지인지 + #
      // 5 ~ 15
      console.log(Math.floor(Math.random() * 10) + 5);
    </script>

    <h2>Date 객체</h2>
    <script>
      const now = new Date();
      console.log(now);
      console.log(
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`
      ); // month starts as 0, so need to add + 1 to push month up

      // Date(Year, month, date, time, minute, second)
      const date = new Date(2025, 11, 16, 17, 50, 0);
      console.log("특정날짜 :", date);

      // 간략화 된 날짜 출력
      const date2 = new Date("2025-12-16");
      console.log(date2);

      // 특정 시간까지 추가할땐
      const date3 = new Date("2025-12-16T17:50:00");
      console.log(date3);
    </script>

    <h2>Timer</h2>
    <script>
      // setTimeout : 일정 시간 후 1회 동작
      setTimeout(() => {
        console.log("3초 후!");
      }, 3000);

      // setInterval : 일정 시간 마다 동작
      let sec = 0;
      setInterval(() => {
        // console.log(`${++sec}초`); //delete this
      }, 1000);
    </script>

    <h2>String 객체</h2>

    <script>
      const str = "Hello, Javascript!";
      console.log("길이 : ", str.length); // space값 포함 18자
      console.log("포함여부 : ", str.includes("Java")); // java != Java
      console.log("위치 : ", str.indexOf("script")); // 특정 단어 시작 순번 위치
      console.log("일부", str.slice(7, 17)); // 특정 순번 ~ 순번 까지 출력
      console.log("대문자 : ", str.toUpperCase()); // 대문자
      console.log("소문자 : ", str.toLowerCase()); // 소문자
    </script>

    <h2>JSON 객채</h2>
    <script>
      //데이터를 문자열로 변환 및 파싱
      const obj = {
        name: "김주현",
        age: 12,
      };

      const jsonStr = JSON.stringify(obj);
      console.log(obj.name);
      console.log(obj.age);
      console.log(jsonStr);
      const parsed = JSON.parse(jsonStr);
      console.log(parsed);
    </script>
  </body>
</html>
