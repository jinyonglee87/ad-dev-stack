<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정규표현식</title>
  </head>
  <body>
    <h1>정규표현식 (regular Expression)</h1>
    <p>문자열에서 특정 패턴을 착거나, 대체하거나, 나누는 도구</p>

    <h2>기본 메타문자</h2>
    <ul></ul>
    <script>
      // ^ : 문자열의 시작
      const patternStart = /^H/; // 대문자 H로 시작하는지 여부
      console.log("^ Test", patternStart.test("Hello"));

      // $ : 문자열의 끝
      const patternEnd = /d$/; // 소문자 d로 끝나는지 여부
      console.log("$ Test", patternEnd.test("bads"));

      // . : 임의의 한 문자
      const patternDot = /^.$/; // 문자가 하나만 있는지 없는지 여부
      console.log(". Test", patternDot.test("Hello"));

      // . : 임의의 한 문자
      const patternDot2 = /H.llo/; // 어떤 문자 상관없이 딱 한 문자
      console.log(". Test", patternDot2.test("Hello"));

      // * : 앞 문자가 >0<회 이상 반복
      const patternStar = /abc*d/; // c가 없어도 되고 그 이상도 된다
      console.log("* Test", patternStar.test("abd"));

      // + : 앞 문자가 >1<회 이상 반복
      const patternPlus = /abc+d/; //c가 한 개 이상은 있어야 한다
      console.log("+ Test", patternPlus.test("abd"));

      // ? : 앞 문자가 0~1회 반복
      const patternQ = /colo?r/; // o가 0개 아니면 1개
      console.log("? Test", patternQ.test("color"));

      // {m,n} : 최소 m ~ 최대 n회 반복 (, 간격 없어야 한다)
      const patternRepeat = /^a{2,4}$/; // a가 2글자 이상 4글자 이하 허용
      console.log("{m,n} Test", patternRepeat.test("aaa"));

      // [] : 문자셋 a-z : 알파벳 소문자들,
      // A-Z : 알파벳 대문자,
      // 0-9 : 숫자들
      // 한글 : 가-힣
      // !-~ : 특수문자들 부터 알파벳 소문자, 대문자, 숫자까지
      const patternSet = /^[a-z]{2,5}$/; //
      console.log("[] Test", patternSet.test("ababa"));
      const patternSet2 = /^[!-~]+$/;
      console.log("[] Test 2", patternSet2.test("sky00^^SK"));

      // () : 그룹화, | : or
      const patternG = /dog|cat/; // dog 또는 cat이 있는지 여부
      console.log("(), | Test", patternG.test("doggocatfish"));

      // \d : 숫자(0-9), \D : 숫자 제외
      const patternDigit = /^\d+$/;
      console.log("\\d Test", patternDigit.test("12345ffff")); // 문자가 들어감으로써 false
      const patternDigit2 = /^\D+$/;
      console.log("\\D Test", patternDigit2.test("3232sdfsdf")); // 숫자가 들어감으로써 false

      // \w : 문자/숫자/_ 포함
      // \W : 그 외
      const patternW = /^\w+$/;
      console.log("\\w Test", patternW.test("234sdf_"));
      const patternW2 = /^\W+$/;
      console.log("\\W Test", patternW.test("!@#@#$"));

      // \s : 공백, \S : 공백 제외
      const patternSpace = /\s+/; // 공백 있는지 여부
      console.log("\\s Test", patternSpace.test("s d s"));
      const patternSpace2 = /\S+/; //공백 없는지 여부
      console.log("\\S Test", patternSpace2.test("s d s")); // true?
    </script>

    <h2>match / replace / split</h2>
    <script>
      const test = "apple banana kiwi orange";
      console.log("match : ", test.match(/kiwi/));
      console.log("replace : ", test.replace(/a/, "y")); // /a/g, "y"
      console.log("split : ", "010-8487-2265".split(/-/));
    </script>

    <h2>주민등록번호 정규표현식</h2>
    <input type="text" id="rrn" placeholder="-포함해서 입력해주세요" />
    <p id="result"></p>
    <script>
      rrn.addEventListener("input", (e) => {
        console.log(e.target.value);
        //성별 : - 다음 바로 나오는 숫자가 1~4까지만 허용
        let regExp = /^\d{6}-\d{7}$/;
        regExp =
          /^[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[1-2][0-9]|3[0-1])-[1-4][0-9]{6}$/;
        // 생년월일 : 년 - 두자리 숫자, 월 - 01-12, 일 - 01~31
        if (regExp.test(e.target.value)) {
          //   console.log("주민등록 맞음!");
          result.innerHTML = "ok!";
          result.style.color = "green";
        } else {
          //   console.log("주민등록 툴림!");
          result.innerHTML = "no!";
          result.style.color = "red";
        }
      });
    </script>
  </body>
</html>
