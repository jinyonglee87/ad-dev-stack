    <h1>조건문</h1>
    <h2><code>if / else</code></h2>
    <h2><p id="console"></p></h2>
    <script>
      /*
        if(조건) {
        조건이 true일때 실행되는 코드
        } else {
         조건이 false일때 실행되는 코드

         else 생략 가능
        }
        */
      let age = 19;

      if (age > 19) {
        console.log("성인");
      } else {
        console.log("미성년자");
      }

      // 삼항 연산자 : 조건 ? 조건이 true : 조건이 false
      age = 20;
      const result = age > 19 ? "성인" : "미성년자";

      console.log(result);
    </script>

      if (age1 >= 20) {
        result2 = "성인";
      } else if (age1 >= 14) {

      console.log(result2);
      console.log(
        age >= 20 ? "성인" : age >= 14 ? "청소년" : age >= 8 ? "어린이" : "유아"
      );
    </script>

    <h2><code>4. 중첩 if</code></h2>

      switch (fruit) {
        case "apple":
          console.log("Apple");
          break;
        case "orange":
          console.log("Orange");
          break;
        case "banana":
          console.log("Banana");
          break;
        case "kiwi":
          console.log("Kiwi");
      }
    </script>

        } else if (write < 80 && action < 80) {
          console.log("불합격");
        }
      </script>
