      <li>
        두 수와 연산자를 입력받아 사칙연산 결과를 출력하시오.
        <script>
          console.log(" Q8: 여기에 코드를 작성하세요");
          // Q8: 여기에 코드를 작성하세요
          const numA = Number(prompt("Q8: 숫자1 입력"));
          const numB = Number(prompt("Q8: 숫자2 입력"));
          const op = prompt("Q8: 연산자 입력");

          let result2;
          switch (op) {
            case "+":
              result2 = numA + numB;
              break;
            case "-":
              result2 = numA - numB;
              break;
            case "*":
              result2 = numA * numB;
              break;
            case "/":
              result2 = numA / numB;
              break;
          }

          console.log(`${numA} ${op} ${numB} = ${result2}`);
        </script>
