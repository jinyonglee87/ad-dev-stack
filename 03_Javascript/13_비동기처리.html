<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비동기처리</title>
  </head>
  <body>
    <h1>비동기 처리</h1>
    <p>
      JS는 싱글스레드(한 번에 한 작업)라 비동기로 대기 중에도 UI와 로직을
      유지해야 함. 서버 요청, 타이머 등 처리 중에도 다른 작업이 멈추지 않도록
      하기 위해 처리
    </p>
    <h2>콜백(callback)</h2>
    <p>
      콜백은 함수가 다른 함수의 인자로 전달되어 실행되는 방식. 비동기 작업이
      완료되면 콜백 함수가 호출되어 결과를 처리함. 예를 들어, 서버에서 데이터를
      가져오는 작업이 완료되면 콜백 함수가 호출되어 데이터를 처리할 수 있습니다.
    </p>
    <p id="callbackResult"></p>
    <button>콜백 실행</button>
    <script>
      const callback = () => {
        console.log("콜백 함수가 실행되었습니다.");
        setTimeout(() => {
          callbackResult.innerHTML = "0초 후 실행";
          callbackResult.innerHTML = "1초 후에 실행";
          setTimeout(() => {
            callbackResult.innerHTML = "2초 후에 실행";
          }, 1000);
        }, 1000); // 콜백 중첩으로 코드 가독성이 떨어지고 유지보수도 어려움 -> 콜백지옥
        callbackResult.innerHTML = "0초 후에 실행 2";
      };
    </script>

    <h2>
      Promise
      <button id="promiseBtn">promise 실행</button>
      <p id="promiseResult"></p>
    </h2>
    <script>
      const promise = () => {
        new Promise((resolve) => {
          setTimeout(() => resolve("1초 후 실행"), 1000);
        })
          .then((result) => {
            promiseResult.innerHTML = result;
            return new Promise((resolve) => {
              setTimeout(() => resolve("2초 후 실행"), 1000);
            });
          })
          // then()을 연속 호출해 비동기 작업 순서를 표현 - 체이닝 방식
          .then((result) => {
            promiseResult.innerHTML = result;
            return new Promise((resolve) => {
              setTimeout(() => resolve("3초 후 실행"), 1000);
            });
          })
          .then((result) => {
            promiseResult.innerHTML = result;
          });
      };
      document.getElementById("promiseBtn").onclick = promise;
    </script>

    <h2>async / await</h2>
    <button onclick="asyncAwait()">Async/Await</button>
    <p id="asyAwaResult"></p>
    <script>
      const delay = () => {
        return new Promise((resolve) =>
          setTimeout(() => resolve("hello"), 1000)
        );
      };
      const asyncAwait = async () => {
        const response = await delay("1 sec later");
        asyAwaResult.innerHTML = response;
        const response2 = await delay("2 sec later");
        asyAwaResult.innerHTML = response2;
        const response3 = await delay("3 sec later");
        asyAwaResult.innerHTML = response3;
      };
    </script>

    <h2>서버와 연동 fetch + async/await</h2>
    <button onclick="fetchData()">데이터 가져오기</button>
    <p id="fetchResult"></p>
    <script>
      const fetchData = async () => {
        const response = await fetch("https://api.tvmaze.com/shows");
        const data = await response.json();
        console.log(data);
        fetchResult.innerHTML = `${data[239].name}`; // data.length = 240
      };
    </script>
  </body>
</html>
