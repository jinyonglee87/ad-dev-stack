    <style>
      body {
        background: lightblue;
      }

      p {
        display: flex;
        flex-direction: column;

        background-color: bisque;

      .container {
        display: flex;

        justify-content: space-evenly;

      .container #box {
        background: pink;

        url(../asset/spy3.jpg);
        background-position: center;
        background-size: cover;
      }

            .container #box2 {
        background: pink;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url(../asset/spy1.jpg),
        url(../asset/spy2.jpg),
        url(../asset/spy3.jpg);
        background-position: center;

      }
            .container #box3 {

      <div id="box3"></div>
    </div>
