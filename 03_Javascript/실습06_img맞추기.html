<!DOCTYPE html>
<html lang="en">
  <head>

    <script src="../04_JS/실습06_img.js"></script>

    <style>
      body {
        display: flex;

        text-align: center;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family:Arial, Helvetica, sans-serif;

      }
      
      h2 {
        font-style: italic;
        visibility: hidden;
      }

      img {
        border-radius: 50%;
        width: 200px;
        height: 200px;
        object-fit: cover;
        margin: 10px;
      }

      button {

        font-weight: 700;
        border: none;
        padding: 5px 10px;
        border-radius: 15px;
        background: rgb(255, 156, 156);
        cursor: pointer;
      }

      button:last-child {
        background: navy;
        color:tomato;
      }

      승리!
    </h4>
    </p>
    <section>
    <img src="../asset/spy1.jpg" alt="">

    <img src="../asset/spy3.jpg" alt="">

    <section>
