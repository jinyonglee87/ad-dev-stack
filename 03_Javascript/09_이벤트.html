<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event</title>
    <script src="../04_JS/09_event.js"></script>
    <style>
      body {
        height: 2000px;
      }
      section {
        display: flex;
      }
      .box {
        width: 200px;
        height: 100px;
        background: navy;
        line-height: 100px;
        text-align: center;
        color: aliceblue;
        margin: 10px;
      }

      .moveBox {
        width: 50px;
        height: 50px;
        background: tomato;
        position: relative;
        top: 20px; /*negative value is bottom*/
        left: 30px; /*negative value is left*/
        /* right: 30px;
        bottom: 20px; */
      }

      #scroll {
        background: indigo;
        width: 100%;
        height: 5px;
        position: fixed;
        top: 0;
        left: 0;
      }

      .container {
        background: skyblue;
        display: flex;
      }

      .container img {
        width: 150px;
      }
    </style>
  </head>
  <body>
    <h1>Event</h1>
    <h2>1. 클릭 이벤트</h2>
    <section>
      <div id="click" class="box">Click!</div>
      <div id="double" class="box">Double Click!</div>
      <div id="right" class="box">Right Click!</div>
      <div id="hover" class="box">Hover!</div>
    </section>

    <h2>2. 폼 이벤트</h2>
    <section>
      <input type="text" id="input" />
      <p id="inputResult"></p>
    </section>
    <section>
      <select name="" id="select">
        <option value="사과">사과</option>
        <option value="블루베리">블루베리</option>
      </select>
      <p id="selectResult"></p>
    </section>
    <form action="" method="post" id="form">
      <input type="text" name="username" id="input" />
      <button type="submit">재출</button>
    </form>

    <h2>3. keyboard event</h2>
    <p id="keyResult"></p>
    <input type="text" id="keyboard" placeholder="type here..." />
    <br /><br />
    <div class="container">
      <div class="moveBox"></div>
    </div>

    <h2>4. scroll event</h2>
    <div id="wheel"></div>
    <div id="scroll"></div>

    <h2>5. event 위임</h2>
    <div class="container">
      <img src="../asset/spy1.jpg" alt="" />
      <img src="../asset/spy2.jpg" alt="" />
      <img src="../asset/spy3.jpg" alt="" />
    </div>
  </body>
</html>
